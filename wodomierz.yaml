# Odczyt wodomierza z nakładką radiową Diehl IZAR RC 868 – ESP32 + CC1101.
# Odczyty przez Wireless M-Bus (T1, 868,95 MHz) -> Home Assistant (API ESPHome).
# Ustaw meter_id poniżej (ID radiowe nakładki – NIE numer z naklejki, patrz README).
# Okablowanie CC1101 -> ESP32: VCC→3V3, GND→GND, MOSI(SI)→GPIO32, SCK→GPIO33, MISO(SO)→GPIO19,
#                              CSN→GPIO23, GDO0→GPIO22, GDO2 – niepodłączone.
substitutions:
  name: wodomierz
  friendly: Wodomierz
  meter_id: "0x00000000"   # ID radiowe Twojej nakładki

esphome:
  name: ${name}
  friendly_name: ${friendly}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://SzczepanLeon/esphome-components@main
    components: [wmbus_radio, wmbus_common, wmbus_meter]
    refresh: 1d

logger:
  level: DEBUG
  logs:
    packet: INFO
    wmbusmeters: INFO
    CC1101: ERROR

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 15min
  ap:
    ssid: wodomierz-setup
    password: !secret failover_password

captive_portal:

web_server:
  port: 80
  version: 3

time:
  - platform: homeassistant

spi:
  clk_pin: GPIO33
  mosi_pin: GPIO32
  miso_pin: GPIO19

wmbus_radio:
  radio_type: CC1101
  cs_pin: GPIO23
  irq_pin: GPIO22
  frequency: 868.95MHz
  # każda odebrana ramka w logu – tak znajdziesz ID swojej nakładki (można usunąć, gdy działa)
  on_frame:
    - then:
        - logger.log:
            level: INFO
            format: "ramka RSSI=%d dBm tryb=%s dane=%s"
            args: ['frame->rssi()', 'toString(frame->link_mode())', 'frame->as_hex().c_str()']

wmbus_common:
  drivers:
    - izar

wmbus_meter:
  - id: woda
    meter_id: ${meter_id}
    type: izar
    mode: [T1]

sensor:
  - platform: wmbus_meter
    parent_id: woda
    field: total_m3
    name: Stan licznika
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: wmbus_meter
    parent_id: woda
    field: last_month_total_m3
    name: Stan na koniec miesiąca
    unit_of_measurement: "m³"
    device_class: water
    accuracy_decimals: 3
  - platform: wmbus_meter
    parent_id: woda
    field: remaining_battery_life_y
    name: Bateria nakładki
    unit_of_measurement: "lat"
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: wmbus_meter
    parent_id: woda
    field: rssi_dbm
    name: Sygnał licznika
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
  - platform: wifi_signal
    name: Wi-Fi
    update_interval: 120s
    entity_category: diagnostic
  - platform: uptime
    name: Czas pracy
    entity_category: diagnostic

text_sensor:
  - platform: wmbus_meter
    parent_id: woda
    field: current_alarms
    name: Alarmy
  - platform: wmbus_meter
    parent_id: woda
    field: previous_alarms
    name: Poprzednie alarmy
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: Adres IP
      entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Status

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
