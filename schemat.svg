<text x="600" y="600" class="lab">Ściąga</text>
<rect x="600" y="615" width="26" height="8" rx="4" fill="#ff5252"></rect>
<text x="638" y="626" class="note">VCC  →  3V3</text>
<rect x="600" y="637" width="26" height="8" rx="4" fill="#bdbdbd"></rect>
<text x="638" y="648" class="note">GND  →  GND</text>
<rect x="600" y="659" width="26" height="8" rx="4" fill="#ffb300"></rect>
<text x="638" y="670" class="note">MOSI / SI  →  D32 (GPIO32)</text>
<rect x="600" y="681" width="26" height="8" rx="4" fill="#42a5f5"></rect>
<text x="638" y="692" class="note">SCK / SCLK  →  D33 (GPIO33)</text>
<rect x="600" y="703" width="26" height="8" rx="4" fill="#ab47bc"></rect>
<text x="638" y="714" class="note">MISO / SO  →  D19 (GPIO19)</text>
<rect x="600" y="725" width="26" height="8" rx="4" fill="#66bb6a"></rect>
<text x="638" y="736" class="note">GDO0  →  D22 (GPIO22)</text>
<rect x="600" y="747" width="26" height="8" rx="4" fill="#26c6da"></rect>
<text x="638" y="758" class="note">CSN / CS  →  D23 (GPIO23)</text>
<text x="870" y="626" class="warn">VCC tylko do 3V3, nie do VIN!</text>
<text x="870" y="648" class="note">5V uszkodzi moduł radiowy.</text>
<text x="870" y="670" class="note">GDO2 zostaje wolne.</text>
<text x="870" y="692" class="note">Antenę przykręć przed</text>
<text x="870" y="710" class="note">pierwszym uruchomieniem.</text>
<text x="870" y="740" class="sub">Płytka 38-pin: te same GPIO,</text>
<text x="870" y="758" class="sub">inne położenie pinów.</text>
