<rect width="1100" height="820" fill="#14161a"/>
<text x="40" y="44" class="lab" style="font-size:24px">Wodomierz: połączenie ESP32 ↔ CC1101 (868 MHz)</text>
<text x="40" y="68" class="sub">ESP32 DevKit V1 (30 pinów, widok od strony elementów, USB na dole). 7 przewodów. Odłącz płytkę od USB na czas łączenia.</text>
